name: Feature request
description: Suggest an adapter, scanner, filter, archive, or interface improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: What task is difficult with the current userscript?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired adapter, controls, detection rule, or output.
    validations:
      required: true
  - type: input
    id: adapter
    attributes:
      label: Site or adapter
      placeholder: Discord, another supported site, or a proposed new site
  - type: textarea
    id: boundaries
    attributes:
      label: Source and safety boundaries
      description: Identify the rendered source, download host, and DOM or URL pattern involved.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
