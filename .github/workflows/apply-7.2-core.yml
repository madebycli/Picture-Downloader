name: Apply 7.2 core

on:
  push:
    branches:
      - fix/7.2-discord-navigation-ui
    paths:
      - scripts/apply-7.2-core.mjs
      - .github/workflows/apply-7.2-core.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Apply source changes
        run: node scripts/apply-7.2-core.mjs
      - name: Install dependencies
        run: npm ci
      - name: Validate generated source
        id: validation
        continue-on-error: true
        run: npm test 2>&1 | tee validation.log
      - name: Upload validation output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: apply-7.2-core-validation
          path: validation.log
      - name: Stop on validation failure
        if: steps.validation.outcome != 'success'
        run: exit 1
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add automatic date intervals and compact tabs"
          git push
