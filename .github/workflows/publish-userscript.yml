name: Publish assembled userscript

on:
  push:
    branches: [main]
    paths:
      - "src/core/**"
      - "src/adapters/**"
      - "src/build-manifest.json"
      - "scripts/assemble-userscript.mjs"
      - "scripts/check-userscript.mjs"
      - "package.json"
      - ".github/workflows/publish-userscript.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-userscript-main
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Commit assembled userscript
        run: |
          if [ -z "$(git status --porcelain -- media-archiver.user.js)" ]; then
            echo "Generated userscript is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media-archiver.user.js
          git commit -m "build: assemble userscript"
          git pull --rebase origin main
          git push origin HEAD:main
