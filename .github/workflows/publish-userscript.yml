name: Publish assembled userscript

on:
  push:
    branches: [main]
    paths:
      - "src/parts/**"
      - "scripts/assemble-userscript.mjs"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Commit assembled userscript
        run: |
          if git diff --quiet -- discord-media-archiver.user.js; then
            echo "Generated userscript is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discord-media-archiver.user.js
          git commit -m "build: assemble userscript"
          git push
