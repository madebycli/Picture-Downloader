name: Export repository snapshot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: picture-downloader-source
          path: .
          include-hidden-files: true
          retention-days: 1
