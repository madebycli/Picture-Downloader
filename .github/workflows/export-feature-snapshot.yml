name: Export feature snapshot

on:
  push:
    branches:
      - feature/pinterest-smart-sync
    paths:
      - ".github/workflows/export-feature-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: media-archiver-feature-source
          path: .
          include-hidden-files: true
          retention-days: 1
