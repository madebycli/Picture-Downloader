name: Fix 7.2 browser regressions

on:
  push:
    branches:
      - fix/7.2-discord-navigation-ui
    paths:
      - scripts/fix-7.2-browser-regressions.mjs
      - .github/workflows/fix-7.2-browser-regressions.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Apply targeted fixes
        run: node scripts/fix-7.2-browser-regressions.mjs
      - name: Install tooling
        run: npm install
      - name: Run complete static validation
        run: npm test
      - name: Install Chromium and Firefox
        run: npx playwright install --with-deps chromium firefox
      - name: Run Chromium and Firefox UI tests
        id: ui
        continue-on-error: true
        run: npx playwright test --project=chromium --project=firefox 2>&1 | tee playwright-7.2.log
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fix-7.2-browser-evidence
          path: |
            playwright-7.2.log
            playwright-report
            test-results
          if-no-files-found: ignore
      - name: Stop on browser failure
        if: steps.ui.outcome != 'success'
        run: exit 1
      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve Archive controls and date switch interaction"
          git push
