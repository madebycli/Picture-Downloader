name: Prepare 7.3 singleton UI fix

on:
  push:
    branches:
      - fix/7.3-userscript-singleton-ui
    paths:
      - scripts/prepare-7.3-singleton.mjs
      - .github/workflows/prepare-7.3-singleton.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Apply 7.3 singleton patch
        run: node scripts/prepare-7.3-singleton.mjs
      - name: Install tooling
        run: npm install
      - name: Run complete validation
        run: npm test
      - name: Install Chromium and Firefox
        run: npx playwright install --with-deps chromium firefox
      - name: Run browser regression matrix
        run: npx playwright test --project=chromium --project=firefox
      - name: Commit verified 7.3 fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            CHANGELOG.md \
            package.json \
            package-lock.json \
            media-archiver.user.js \
            src/core/00-bootstrap.user.js.part \
            tests/baseline.test.mjs \
            tests/ui/7.3-singleton-ui.spec.mjs
          git commit -m "fix: enforce one Media Archiver UI per document"
          git push
